name: Django App

on:
  push:
    branches: [ dev, main]
  workflow_dispatch: 

jobs: 

  extract-version:
   runs-on: ubuntu-latest
   steps:
     - name: Checkout
       uses: actions/checkout@v4

     - name: Install tomlq
       run: pip install tomlq

     - name: Extract Version 
       run: |
       
        VERSION=$(tomlq -r '.tool.poetry.version' pyproject.toml)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version: \"$VERSION\"" > version.yaml
        ls -l

     - name: Debugging the version
       run: echo $VERSION

     - name: Upload Version artifact
       uses: actions/upload-artifact@v4
       with:
         name: version
         path: version.yaml


  build:
   runs-on: ubuntu-latest
   needs: extract-version
   steps:
     - name: Checkout
       uses: actions/checkout@v4

     - name: Download artifact
       uses: actions/download-artifact@v4
       with:
           name: version

     - name: Load version into enviroment
       run: |
          VERSION=$(grep 'version' version.yaml)
          VERSION=$(grep 'version' version.yaml | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      
     - name: Setup python
       uses: actions/setup-python@v4
       with:
         python-version: "3.11"

     - name: Install Poetry
       run: pip install poetry

     - name: Build artifact
       run: poetry build

     - name: Upload artifacts
       uses: actions/upload-artifact@v4
       with:
         name: django-app
         path: dist/

     - name: debugging artifact
       run: |
          ls -l dist

  docker:
   runs-on: ubuntu-latest
   needs: build
   steps:
     - name: Checkout
       uses: actions/checkout@v4 

     - name: Download artifact
       uses: actions/download-artifact@v4
       with:
           name: version

     - name: Load version into environment
       run: |
          VERSION=$(grep 'version' version.yaml | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

     - name: Download artifact
       uses: actions/download-artifact@v4
       with:
        name: django-app

     - name: debugging artifact
       run: ls -l
    
     - name: Config AWS credentials
       uses: aws-actions/configure-aws-credentials@v4
       with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

     - name: login into AWS ECR
       uses: aws-actions/amazon-ecr-login@v2

     - name : Build and push Image
       uses: docker/build-push-action@v6
       with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.AWS_ECR_URL }}/django-app:${{ env.VERSION }}

  get-latest-image:
   runs-on: ubuntu-latest
   outputs:
      latest_tag: ${{ steps.extractlatest.outputs.LATEST_TAG }}
   needs: docker 
   steps:
       - name: Config AWS credentials
         uses: aws-actions/configure-aws-credentials@v4
         with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
    
       - name: login into AWS ECR
         uses: aws-actions/amazon-ecr-login@v2
            
       - name: Get latest image with dev tag
         id: extractlatest 
         run: |
          LATEST_TAG=$(aws ecr describe-images \
            --repository-name django-app \
            --region ${{ secrets.AWS_REGION }} \
            --output json \
          | jq -r '
              .imageDetails[]
              | select(.imageTags != null)
              | select([.imageTags[] | contains("dev")] | any)
              | {pushedAt: .imagePushedAt, tag: (.imageTags[] | select(contains("dev")))}
            ' | jq -s 'sort_by(.pushedAt) | last.tag')

          LATEST_TAG=$(echo "$LATEST_TAG" | tr -d '"')
          echo "LATEST_TAG = $LATEST_TAG"
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_OUTPUT


  promote:
   runs-on: ubuntu-latest
   if: github.ref == 'refs/heads/main'
   outputs:
     base_tag: ${{ steps.extractbase.outputs.BASE_TAG }}
   needs: get-latest-image
   steps:
       - name: Config AWS credentials
         uses: aws-actions/configure-aws-credentials@v4
         with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
    
       - name: login into AWS ECR
         uses: aws-actions/amazon-ecr-login@v2

       - name: Get base image
         id: extractbase 
         run: |
          BASE_TAG=$(echo "${{ needs.get-latest-image.outputs.latest_tag }}" | sed 's/\.dev[0-9]\+$//')
          echo "BASE_TAG = $BASE_TAG"
          echo "BASE_TAG=$BASE_TAG" >> $GITHUB_OUTPUT
     
       - name: Tag & push promoted image
         run: |
            echo ${{ needs.get-latest-image.outputs.latest_tag }}
            docker pull ${{ secrets.AWS_ECR_URL }}/django-app:${{ needs.get-latest-image.outputs.latest_tag }}
            docker tag ${{ secrets.AWS_ECR_URL }}/django-app:${{ needs.get-latest-image.outputs.latest_tag }} \
                      ${{ secrets.AWS_ECR_URL }}/django-app:${{ steps.extractbase.outputs.base_tag }}
            docker push ${{ secrets.AWS_ECR_URL }}/django-app:${{ steps.extractbase.outputs.base_tag }}

  deploy-dev:
    runs-on: ubuntu-latest  
    if: github.ref == 'refs/heads/dev'
    needs: get-latest-image
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
           name: version

      - name: Load version into enviroment
        run: |
          VERSION=$(grep 'version' version.yaml | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: ssh to the server
        uses: appleboy/ssh-action@v1.0.3
        with:  
          host: ${{ secrets.HOST }} 
          username: ${{ secrets.HOST_NAME }}
          key: ${{ secrets.KEY }}
          script: | 
           export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
           export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
           export AWS_REGION=${{ secrets.AWS_REGION }}
           export ACCOUNT_ID=${{ secrets.ACCOUNT_ID }}

           aws ecr get-login-password --region $AWS_REGION \
             | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

           docker pull $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/django-app:${{ env.VERSION }}
           
           docker stop django-app
           docker rm django-app
           docker run -dp 8080:4000 \
            --name django-app \
            ${{ secrets.AWS_ECR_URL }}/django-app:${{ env.VERSION }}

            
  deploy-prod:
    runs-on: ubuntu-latest  
    if: github.ref == 'refs/heads/main'
    needs: promote
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: version

      - name: Load version into environment
        run: |
          VERSION=$(grep 'version' version.yaml | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: SSH to the server and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:  
          host: ${{ secrets.HOST }} 
          username: ${{ secrets.HOST_NAME }}
          key: ${{ secrets.KEY }}
          script: | 
            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            export AWS_REGION=${{ secrets.AWS_REGION }}
            export ACCOUNT_ID=${{ secrets.ACCOUNT_ID }}

            # Login to ECR
            aws ecr get-login-password --region $AWS_REGION \
              | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

            # Pull promoted image (without snapshot)
            docker pull $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/django-app:${{ env.VERSION }}

            # Stop and remove old container
            docker stop bookshop-prod || true
            docker rm bookshop-prod || true

            # Run new container
            docker run -d \
              -e PORT=3000 \
              -p 80:3000 \
              --name bookshop-prod \
              ${{ secrets.AWS_ECR_URL }}/django-app:${{ env.VERSION }}
